---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Exercises the reusable workflow SKELETONS in this repository against
# downstream fixture repositories, in parallel, to prove the generic
# scaffolding (job graph, harden-runner wiring, dual checkout, artifact
# plumbing, SBOM/Grype chain) functions end-to-end. The placeholder
# build/test/audit/SBOM steps are language-agnostic, so the matrix runs
# against fixtures of different languages by design.
#
# The reusable workflows are referenced with the self-repository
# form ('$/'), which resolves this repository at the commit already
# running. The workflows under test are therefore always the ones
# this branch defines, independently of what any checkout puts in
# the workspace.
#
# The build-test-release and merge skeletons are NOT self-tested here:
# build-test-release requires a signed semver tag-push context (and
# creates/promotes GitHub releases), and merge requires a merged-commit
# context (and would exercise publish legs); neither is available or
# safe on a pull request. Instantiating repos validate those through
# their own release/merge cycles.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Every checkout in a reusable workflow must name the repository it
  # targets. The Gerrit checkout action defaults 'repository' to
  # github.repository, which inside a reusable workflow names the
  # CALLER, not the project under review. A central .github repository
  # acting for another project then seeds the tree from itself. That
  # broke every ONAP documentation check after the docs-workflows
  # migration landed, so guard the shape here rather than trusting
  # review to spot a missing line in a 900-line workflow.
  checkout-targets:
    name: 'Checkout Targets'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Every checkout names a repository'
        shell: bash
        run: |
          # Every checkout in a reusable workflow names a repository
          python3 - <<'GUARD'
          import pathlib, re, sys

          CHECKOUT = re.compile(
              r"uses:\s*(?:actions/checkout"
              r"|[\w-]+/checkout-gerrit-change-action)@")
          GERRIT = re.compile(r"uses:\s*[\w-]+/checkout-gerrit-change-action@")
          REUSABLE = re.compile(r"^\s{2}workflow_call:", re.M)
          DECLARES = re.compile(r"^\s{6}repository:", re.M)
          NAMES = re.compile(r"^\s+repository:", re.M)
          REF = re.compile(r"^\s+ref:", re.M)

          def nested(text, key):
              # Return the mapping nested under 'key', so a match cannot
              # come from a sibling such as 'env'. A checkout that sets
              # env.repository would otherwise satisfy the guard while
              # with.repository stayed absent.
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if not re.match(r"^\s+%s:\s*$" % key, line):
                      continue
                  width = len(line) - len(line.lstrip())
                  body = []
                  for entry in lines[index + 1:]:
                      stripped = entry.strip()
                      if stripped and not stripped.startswith("#"):
                          if len(entry) - len(entry.lstrip()) <= width:
                              break
                      body.append(entry)
                  return "\n".join(body)
              return ""

          def block(lines, index):
              start = index
              while start and not lines[start].lstrip().startswith("- "):
                  start -= 1
              width = len(lines[start]) - len(lines[start].lstrip())
              end = start + 1
              while end < len(lines):
                  body = lines[end].strip()
                  if body and not body.startswith("#"):
                      if len(lines[end]) - len(lines[end].lstrip()) <= width:
                          break
                  end += 1
              return "\n".join(lines[start:end])

          hint = "$" + "{{ inputs.repository || github.repository }}"
          fix = "repository: " + hint
          failures = checked = 0

          for wf in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              text = wf.read_text(encoding="utf-8")
              if not REUSABLE.search(text):
                  continue
              declares = DECLARES.search(text) is not None
              lines = text.splitlines()
              checked += 1
              for number, line in enumerate(lines):
                  if not CHECKOUT.search(line):
                      continue
                  supplied = nested(block(lines, number), "with")
                  if NAMES.search(supplied):
                      continue
                  if declares:
                      why = "the workflow declares a 'repository' input"
                  elif GERRIT.search(line) and REF.search(supplied):
                      why = "this Gerrit checkout pins 'ref'"
                  else:
                      continue
                  print(f"::error file={wf},line={number + 1}::Checkout does "
                        f"not name a repository, but {why}. Add: {fix}")
                  failures += 1

          print(f"Checked {checked} reusable workflow(s); "
                f"{failures} problem(s).")
          sys.exit(1 if failures else 0)
          GUARD

  # Fixture repositories of different languages, fanned out in parallel
  # via a matrix; the template placeholders run identically for both.
  # Each call of build-test.yaml in this run passes its own
  # artifact_suffix: without one, the calls upload their build, SBOM
  # and Grype artefacts under the same names. The Grype job binds to
  # its own SBOM by artefact ID regardless.
  build-test:
    name: 'Build/Test (${{ matrix.name }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'test-go-project'
            repository: 'lfreleng-actions/test-go-project'
          - name: 'test-node-project'
            repository: 'lfreleng-actions/test-node-project'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: ${{ matrix.repository }}
      artifact_suffix: ${{ matrix.name }}

  # The build-test skeleton with the allow-list inputs set, on one
  # fixture. The matrix above runs on the pinned baseline alone and
  # keeps proving the default policy; this leg proves the three inputs
  # reach the action. 'lfreleng-actions//' is the calling
  # organisation's own list, so the action allows it unpinned. It
  # follows lfreleng-actions/.github at its default branch, which can
  # carry hosts the pinned baseline does not yet, so the merged list is
  # the union of the two rather than the baseline again. 'github.com:443'
  # is on both lists, so the action reports it as redundant.
  build-test-allowlist:
    name: 'Build/Test (allow-list inputs)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      artifact_suffix: 'allowlist'
      harden_runner_supplemental_allowlist: 'lfreleng-actions//'
      harden_runner_supplemental_unpinned: true
      harden_runner_extra_endpoints: 'github.com:443'

  # Change-scoped Grype gating, end to end, in two lanes:
  #
  #   - unresolved: a fixture of another repository, pinned to a
  #     commit, cannot share a base with this pull request, so
  #     repository-metadata-action leaves the verdict empty; the
  #     assertion proves that path gates (gate-active true);
  #   - resolved: this repository itself, checked out at the commit
  #     that triggered the run, so on a pull_request the verdict
  #     resolves to 'true' or 'false' and must decide the gate. On
  #     workflow_dispatch no base exists, the verdict stays empty and
  #     the lane must gate like the unresolved one.
  #
  # The placeholder build and SBOM steps need no real project, so the
  # resolved lane builds this repository. Each lane passes its own
  # artifact_suffix, as every call here does.
  build-test-gate-unresolved:
    name: 'Build/Test (Grype gate, unresolved)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      repository: 'lfreleng-actions/test-go-project'
      ref: '02a24ba15c4687eb443bf407b5fc0b4d099ab86f'  # v0.1.0
      grype_gate_when: 'dependencies-changed'
      artifact_suffix: 'gate-unresolved'

  assert-gate-unresolved:
    name: 'Assert Unresolved Verdict Gates'
    needs: build-test-gate-unresolved
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Check verdict and gate-active'
        shell: bash
        env:
          # yamllint disable-line rule:line-length
          GATE_ACTIVE: ${{ needs.build-test-gate-unresolved.outputs.grype_gate_active }}
          # yamllint disable-line rule:line-length
          VERDICT: ${{ needs.build-test-gate-unresolved.outputs.grype_dependencies_changed }}
        run: |
          # An unresolved verdict must arm the gate; anything else lets
          # a change pass with the gate off although detection never ran
          if [ -n "${VERDICT}" ]; then
            echo "::error::grype_dependencies_changed is '${VERDICT}'," \
              "expected empty for another repository's checkout"
            exit 1
          fi
          if [ "${GATE_ACTIVE}" != 'true' ]; then
            echo "::error::grype_gate_active is '${GATE_ACTIVE}'," \
              "expected 'true' on the unresolved path"
            exit 1
          fi
          echo "Unresolved verdict gates ✅"

  # grype_permit_fail only stops a finding from failing the job; the
  # gate is still decided first, and gate-active reports it.
  build-test-gate-resolved:
    name: 'Build/Test (Grype gate, resolved)'
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    uses: $/.github/workflows/build-test.yaml
    with:
      grype_gate_when: 'dependencies-changed'
      grype_permit_fail: true
      artifact_suffix: 'gate-resolved'

  assert-gate-resolved:
    name: 'Assert Resolved Verdict Decides the Gate'
    needs: build-test-gate-resolved
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Check verdict and gate-active'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # yamllint disable-line rule:line-length
          GATE_ACTIVE: ${{ needs.build-test-gate-resolved.outputs.grype_gate_active }}
          # yamllint disable-line rule:line-length
          VERDICT: ${{ needs.build-test-gate-resolved.outputs.grype_dependencies_changed }}
        run: |
          echo "Event: ${EVENT_NAME}; verdict: '${VERDICT}';" \
            "gate-active: '${GATE_ACTIVE}'"
          if [ "${EVENT_NAME}" = 'pull_request' ]; then
            # The base resolves here, so the verdict must be set and the
            # gate must follow it
            case "${VERDICT}" in
              true|false) ;;
              *)
                echo "::error::grype_dependencies_changed is" \
                  "'${VERDICT}', expected 'true' or 'false' on a pull" \
                  "request of this repository"
                exit 1
                ;;
            esac
            if [ "${GATE_ACTIVE}" != "${VERDICT}" ]; then
              echo "::error::grype_gate_active is '${GATE_ACTIVE}'," \
                "expected '${VERDICT}' to follow the verdict"
              exit 1
            fi
            echo "Resolved verdict '${VERDICT}' decides the gate ✅"
          else
            # No pull request base: the verdict stays empty and the gate
            # must arm
            if [ -n "${VERDICT}" ] || [ "${GATE_ACTIVE}" != 'true' ]; then
              echo "::error::expected an empty verdict and gate-active" \
                "'true' on ${EVENT_NAME}"
              exit 1
            fi
            echo "Unresolved verdict on ${EVENT_NAME} gates ✅"
          fi
