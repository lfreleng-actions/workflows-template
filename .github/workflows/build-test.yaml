---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable build/test pipeline SKELETON (language-agnostic template).
#
# Reproduces the canonical Linux Foundation pipeline shape. The
# repository-metadata job runs in parallel as an informational step.
# After build the jobs in { } run in parallel; none gates another, so a
# PR surfaces every failure (-> denotes sequence):
#   build -> { tests | audit | sbom -> grype }
#
# Steps marked "# TEMPLATE:" are placeholders. When instantiating this
# template for a language, replace them with the real build/test/audit/
# SBOM actions; the surrounding job graph, harden-runner wiring, dual
# checkout and Grype scan are generic and transfer as-is.
#
# Call this from a thin caller workflow; see examples/build-test/ for
# both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Build/Test (Template)'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Tests ---
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype job scans the
          SBOM, so skipping generation leaves it nothing to scan and it
          is skipped too. To keep the SBOM but drop the scan, use
          grype_enabled instead.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: >-
          Minimum severity that fails the Grype scan: negligible, low,
          medium, high, critical, or none to report without gating
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false
      # Change-scoped gating. With 'dependencies-changed' the
      # repository-metadata job detects whether the change touched a
      # dependency file and the Grype gate arms only when it did; an
      # unresolved verdict, or a failed or skipped metadata job, gates
      # as 'always' does. The detection rules, the file list per preset
      # and the base selection are repository-metadata-action's
      # contract:
      # https://github.com/lfreleng-actions/repository-metadata-action#dependency-change-detection
      grype_gate_when:
        description: >-
          When the Grype scan gates: 'always', or 'dependencies-changed'
          to gate only when the change under test touched a dependency
          file. Findings are reported either way.
        required: false
        type: string
        default: 'always'
      grype_dependency_ecosystems:
        description: >-
          Comma-separated dependency presets the detection checks under
          'dependencies-changed': node, python, go, maven, gradle, rust,
          docker. Empty checks every preset.
        required: false
        type: string
        default: ''
      grype_dependency_patterns:
        description: >-
          Extra dependency file patterns, one per line, added to the
          presets under 'dependencies-changed'. Empty adds none.
        required: false
        type: string
        default: ''
      grype_bypass_repository:
        description: >-
          Repository (owner/name) holding the approved 'BYPASS:' issues
          grype-scan-action honours. Empty reads them from the calling
          repository; set it to share one bypass list.
        required: false
        type: string
        default: ''
      grype_dependency_policy:
        description: >-
          Which findings gate: 'all', or 'declared' for direct
          dependencies only, with transitive ones held to
          grype_transitive_fail_on. Where the SBOM carries no dependency
          graph, 'declared' treats every finding as declared.
        required: false
        type: string
        default: 'declared'
      grype_transitive_fail_on:
        description: >-
          Severity threshold for transitive findings under the
          'declared' policy: none, negligible, low, medium, high or
          critical.
        required: false
        type: string
        default: 'critical'
      grype_only_fixed:
        description: >-
          Gate only on findings with a published fix version. A finding
          nobody can act on is reported, not blocking.
        required: false
        type: boolean
        default: true
      grype_remediation_window_days:
        description: >-
          Days a finding stays a warning after its fix was published on
          an unarmed 'dependencies-changed' run, before it gates as on
          an armed run. Empty disables the window; no effect on
          'always' runs.
        required: false
        type: string
        default: ''
      grype_remediation_window_start:
        description: >-
          Optional floor (YYYY-MM-DD) on the remediation window: a fix
          published before this date counts from it rather than from
          publication. Empty sets no floor; only the days input turns
          the window on.
        required: false
        type: string
        default: ''

      # --- Artefact naming ---
      artifact_suffix:
        description: >-
          Suffix appended, after a hyphen, to the names of the build,
          SBOM and Grype artefacts this workflow uploads. Set a
          distinct value on each call when a caller runs this workflow
          more than once in one run (a matrix). Letters, digits, '.',
          '_' and '-' only; empty keeps the unsuffixed names.
        required: false
        type: string
        default: ''

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false
      harden_runner_extra_endpoints:
        description: >-
          Extra egress endpoints written inline, host[:port] tokens
          separated by spaces or newlines, merged into the allow-list
          for short-lived fixes. Empty adds nothing
        required: false
        type: string
        default: ''

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''
    outputs:
      grype_gate_active:
        description: >-
          Whether the Grype gate was armed ('true' or 'false'); empty
          when the scan did not run. Under grype_gate_when
          'dependencies-changed' this is what the self-test asserts.
        value: ${{ jobs.grype.outputs.gate_active }}
      grype_dependencies_changed:
        description: >-
          The dependency-change verdict the Grype job received: 'true'
          or 'false' when repository-metadata resolved it, empty when
          unresolved, when detection was off or when that job did not
          succeed (all of which gate), and when the scan did not run.
        value: ${{ jobs.grype.outputs.dependencies_changed }}

permissions: {}

# Suffix for the names of the artefacts each call uploads:
# '-<artifact_suffix>', or empty when the input is unset so the
# artefact names stay as they were. Every upload and download of a
# per-call artefact appends it; tests/test-artifact-suffix.sh checks
# each site.
env:
  # yamllint disable-line rule:line-length
  ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix != '' && format('-{0}', inputs.artifact_suffix) || '' }}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on a malformed artifact_suffix, or
    # when gerrit_refspec is set without the project/branch the Gerrit
    # checkout path also requires. The build-chain root job depends on
    # this, so invalid inputs stop the pipeline early and cleanly. This
    # job always runs (only the Gerrit step is conditional), so gating
    # dependents on it does not trip GitHub's "skipped need skips
    # dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      # The suffix becomes part of artefact names, so only characters
      # that are safe there pass.
      - name: 'Validate artifact_suffix input'
        shell: bash
        env:
          ARTIFACT_SUFFIX_INPUT: ${{ inputs.artifact_suffix }}
        run: |
          # Validate artifact_suffix input
          if [[ ! "${ARTIFACT_SUFFIX_INPUT}" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid artifact_suffix input:" \
              "${ARTIFACT_SUFFIX_INPUT}"
            exit 1
          fi

      - name: 'Validate Grype policy inputs'
        shell: bash
        env:
          GRYPE_FAIL_ON: ${{ inputs.grype_fail_on }}
          GRYPE_GATE_WHEN: ${{ inputs.grype_gate_when }}
          # yamllint disable-line rule:line-length
          GRYPE_DEPENDENCY_ECOSYSTEMS: ${{ inputs.grype_dependency_ecosystems }}
          GRYPE_BYPASS_REPOSITORY: ${{ inputs.grype_bypass_repository }}
          GRYPE_DEPENDENCY_POLICY: ${{ inputs.grype_dependency_policy }}
          GRYPE_TRANSITIVE_FAIL_ON: ${{ inputs.grype_transitive_fail_on }}
          # yamllint disable-line rule:line-length
          GRYPE_REMEDIATION_WINDOW_DAYS: ${{ inputs.grype_remediation_window_days }}
          # yamllint disable-line rule:line-length
          GRYPE_REMEDIATION_WINDOW_START: ${{ inputs.grype_remediation_window_start }}
        run: |
          # Reject a typo in the gating policy here, in seconds, rather
          # than in grype-scan-action after the build. The values
          # mirror the action's own enumerations. A window start must
          # be a real calendar date in year 0001 or later, as the
          # action's parser requires; whether it lies in the future
          # is left to the action. The presets are those
          # repository-metadata-action v0.4.0 detects;
          # grype_dependency_patterns is left to the detector, whose
          # grammar governs
          error=0
          case "${GRYPE_FAIL_ON}" in
            negligible|low|medium|high|critical|none) ;;
            *)
              echo "::error::Invalid grype_fail_on input:" \
                "${GRYPE_FAIL_ON}"
              error=1 ;;
          esac
          case "${GRYPE_GATE_WHEN}" in
            always|dependencies-changed) ;;
            *)
              echo "::error::Invalid grype_gate_when input:" \
                "${GRYPE_GATE_WHEN}"
              error=1 ;;
          esac
          # Each comma-separated name, trimmed, must be a preset; an
          # empty name (a stray comma) is a typo too
          if [ -n "${GRYPE_DEPENDENCY_ECOSYSTEMS}" ]; then
            rest="${GRYPE_DEPENDENCY_ECOSYSTEMS},"
            while [ -n "${rest}" ]; do
              ecosystem="${rest%%,*}"
              rest="${rest#*,}"
              ecosystem="${ecosystem#"${ecosystem%%[![:space:]]*}"}"
              ecosystem="${ecosystem%"${ecosystem##*[![:space:]]}"}"
              case "${ecosystem}" in
                node|python|go|maven|gradle|rust|docker) ;;
                *)
                  echo "::error::Invalid grype_dependency_ecosystems input:" \
                    "${GRYPE_DEPENDENCY_ECOSYSTEMS}"
                  error=1
                  break ;;
              esac
            done
          fi
          valid_repository='^([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)?$'
          if [[ ! "${GRYPE_BYPASS_REPOSITORY}" =~ ${valid_repository} ]]; then
            echo "::error::Invalid grype_bypass_repository input:" \
              "${GRYPE_BYPASS_REPOSITORY}"
            error=1
          fi
          case "${GRYPE_DEPENDENCY_POLICY}" in
            all|declared) ;;
            *)
              echo "::error::Invalid grype_dependency_policy input:" \
                "${GRYPE_DEPENDENCY_POLICY}"
              error=1 ;;
          esac
          case "${GRYPE_TRANSITIVE_FAIL_ON}" in
            none|negligible|low|medium|high|critical) ;;
            *)
              echo "::error::Invalid grype_transitive_fail_on input:" \
                "${GRYPE_TRANSITIVE_FAIL_ON}"
              error=1 ;;
          esac
          if [[ ! "${GRYPE_REMEDIATION_WINDOW_DAYS}" =~ ^[0-9]*$ ]]; then
            echo "::error::Invalid grype_remediation_window_days input:" \
              "${GRYPE_REMEDIATION_WINDOW_DAYS}"
            error=1
          fi
          start="${GRYPE_REMEDIATION_WINDOW_START}"
          # The regex fixes the shape; GNU date rejects an impossible
          # day such as 2026-02-31, and the comparison guards against
          # a date that normalises instead. GNU date also accepts year
          # 0000, which the action's parser rejects, so refuse it here
          if [[ ! "${start}" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]] ||
            [ "${start%%-*}" = '0000' ] ||
            { [ -n "${start}" ] &&
              [ "$(date -u -d "${start}" +%F 2>/dev/null)" != "${start}" ]
            }; then
            echo "::error::Invalid grype_remediation_window_start input:" \
              "${start}"
            error=1
          fi
          exit "${error}"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    # The dependency-change verdict for the Grype gate; this job runs no
    # project code and is not a matrix, so one output serves the scan
    outputs:
      # yamllint disable-line rule:line-length
      dependencies_changed: ${{ steps.repo-metadata.outputs.dependencies_changed }}
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@f0e5d2d8dc1154a5d702b75acc551eff6ba072dc  # v0.5.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'
          # Change-scoped Grype gating: detect whether the change touched
          # a dependency file. The checkout above holds full history, or
          # the Gerrit change at depth 2, so the base is present
          # yamllint disable-line rule:line-length
          dependency_change: ${{ inputs.grype_enabled && inputs.grype_gate_when == 'dependencies-changed' }}
          gerrit_refspec: ${{ inputs.gerrit_refspec }}
          dependency_ecosystems: ${{ inputs.grype_dependency_ecosystems }}
          dependency_patterns: ${{ inputs.grype_dependency_patterns }}
          dependency_path_prefix: ${{ inputs.path_prefix }}

  build:
    name: 'Build'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      artefact_name: ${{ steps.build.outputs.artefact_name }}
      artefact_path: ${{ steps.build.outputs.artefact_path }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # TEMPLATE: Replace this placeholder with your language build
      # action, keeping the step id and the artefact_name/artefact_path
      # outputs so downstream jobs continue to work, e.g.:
      #   - name: 'Build project'
      #     id: build
      #     uses: lfreleng-actions/<lang>-build-action@<SHA>  # vX.Y.Z
      #     with:
      #       path_prefix: ${{ inputs.path_prefix }}
      - name: 'Build project (placeholder)'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # TEMPLATE: placeholder build step; produces a trivial text
          # artefact so the artifact plumbing can be exercised.
          cd "${PATH_PREFIX}"
          mkdir -p dist
          {
            echo "workflows-template placeholder build artefact"
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "run_id: ${GITHUB_RUN_ID}"
          } > dist/template-artefact.txt
          echo "artefact_name=template-build" >> "$GITHUB_OUTPUT"
          echo "artefact_path=${PATH_PREFIX}/dist" >> "$GITHUB_OUTPUT"

      - name: 'Upload build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: ${{ steps.build.outputs.artefact_name }}${{ env.ARTIFACT_SUFFIX }}
          path: ${{ steps.build.outputs.artefact_path }}
          if-no-files-found: error

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs: 'build'
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@f5a475661142cd2f1611ae6fbf8af2be0f36a9a7  # v0.16.3
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
