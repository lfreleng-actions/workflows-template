---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable build/test pipeline SKELETON (language-agnostic template).
#
# Reproduces the canonical Linux Foundation pipeline shape. The
# repository-metadata job runs in parallel as an informational step.
# After build the jobs in { } run in parallel; none gates another, so a
# PR surfaces every failure (-> denotes sequence):
#   build -> { tests | audit | sbom -> grype }
#
# Steps marked "# TEMPLATE:" are placeholders. When instantiating this
# template for a language, replace them with the real build/test/audit/
# SBOM actions; the surrounding job graph, harden-runner wiring, dual
# checkout and Grype scan are generic and transfer as-is.
#
# Call this from a thin caller workflow; see examples/build-test/ for
# both a plain GitHub-native caller and a Gerrit-wrapped caller.
name: '[R] Build/Test (Template)'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Tests ---
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype job scans the
          SBOM, so skipping generation leaves it nothing to scan and it
          is skipped too. To keep the SBOM but drop the scan, use
          grype_enabled instead.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: 'Minimum severity that fails the Grype scan'
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false

      # --- Artefact naming ---
      artifact_suffix:
        description: >-
          Suffix appended, after a hyphen, to the names of the build,
          SBOM and Grype artefacts this workflow uploads. Set a
          distinct value on each call when a caller runs this workflow
          more than once in one run (a matrix). Letters, digits, '.',
          '_' and '-' only; empty keeps the unsuffixed names.
        required: false
        type: string
        default: ''

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false
      harden_runner_extra_endpoints:
        description: >-
          Extra egress endpoints written inline, host[:port] tokens
          separated by spaces or newlines, merged into the allow-list
          for short-lived fixes. Empty adds nothing
        required: false
        type: string
        default: ''

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

permissions: {}

# Suffix for the names of the artefacts each call uploads:
# '-<artifact_suffix>', or empty when the input is unset so the
# artefact names stay as they were. Every upload and download of a
# per-call artefact appends it; tests/test-artifact-suffix.sh checks
# each site.
env:
  # yamllint disable-line rule:line-length
  ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix != '' && format('-{0}', inputs.artifact_suffix) || '' }}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on a malformed artifact_suffix, or
    # when gerrit_refspec is set without the project/branch the Gerrit
    # checkout path also requires. The build-chain root job depends on
    # this, so invalid inputs stop the pipeline early and cleanly. This
    # job always runs (only the Gerrit step is conditional), so gating
    # dependents on it does not trip GitHub's "skipped need skips
    # dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      # The suffix becomes part of artefact names, so only characters
      # that are safe there pass.
      - name: 'Validate artifact_suffix input'
        shell: bash
        env:
          ARTIFACT_SUFFIX_INPUT: ${{ inputs.artifact_suffix }}
        run: |
          # Validate artifact_suffix input
          if [[ ! "${ARTIFACT_SUFFIX_INPUT}" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid artifact_suffix input:" \
              "${ARTIFACT_SUFFIX_INPUT}"
            exit 1
          fi

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@7c4a868e1f8e82a27948748eeda306d8e8c117db  # v1.3.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@2206d754f65f1a90f57b49be546712c5f594def2  # v0.3.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  build:
    name: 'Build'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    outputs:
      artefact_name: ${{ steps.build.outputs.artefact_name }}
      artefact_path: ${{ steps.build.outputs.artefact_path }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@7c4a868e1f8e82a27948748eeda306d8e8c117db  # v1.3.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # TEMPLATE: Replace this placeholder with your language build
      # action, keeping the step id and the artefact_name/artefact_path
      # outputs so downstream jobs continue to work, e.g.:
      #   - name: 'Build project'
      #     id: build
      #     uses: lfreleng-actions/<lang>-build-action@<SHA>  # vX.Y.Z
      #     with:
      #       path_prefix: ${{ inputs.path_prefix }}
      - name: 'Build project (placeholder)'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # TEMPLATE: placeholder build step; produces a trivial text
          # artefact so the artifact plumbing can be exercised.
          cd "${PATH_PREFIX}"
          mkdir -p dist
          {
            echo "workflows-template placeholder build artefact"
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "run_id: ${GITHUB_RUN_ID}"
          } > dist/template-artefact.txt
          echo "artefact_name=template-build" >> "$GITHUB_OUTPUT"
          echo "artefact_path=${PATH_PREFIX}/dist" >> "$GITHUB_OUTPUT"

      - name: 'Upload build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: ${{ steps.build.outputs.artefact_name }}${{ env.ARTIFACT_SUFFIX }}
          path: ${{ steps.build.outputs.artefact_path }}
          if-no-files-found: error

  tests:
    name: 'Tests'
    runs-on: ubuntu-latest
    needs: 'build'
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@7c4a868e1f8e82a27948748eeda306d8e8c117db  # v1.3.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # TEMPLATE: Replace this placeholder with your language test
      # action. Pass test_permit_fail through to the action's own
      # permit_fail input where available, e.g.:
      #   - name: 'Run tests'
      #     uses: lfreleng-actions/<lang>-test-action@<SHA>  # vX.Y.Z
      #     with:
      #       path_prefix: ${{ inputs.path_prefix }}
      #       permit_fail: ${{ inputs.test_permit_fail }}
      - name: 'Run tests (placeholder)'
        shell: bash
        env:
          # The NO_BLOCK/soft-fail pattern: the test_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.test_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # TEMPLATE: placeholder test step; replace with real tests.
          status=0
          echo "Placeholder tests executed"
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Tests failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  audit:
    name: 'Audit Dependencies'
    runs-on: ubuntu-latest
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.audit_enabled }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@7c4a868e1f8e82a27948748eeda306d8e8c117db  # v1.3.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # TEMPLATE: Replace this placeholder with your language dependency
      # audit action, e.g.:
      #   - name: 'Audit dependencies'
      #     uses: lfreleng-actions/<lang>-audit-action@<SHA>  # vX.Y.Z
      #     with:
      #       path_prefix: ${{ inputs.path_prefix }}
      #       permit_fail: ${{ inputs.audit_permit_fail }}
      - name: 'Audit dependencies (placeholder)'
        shell: bash
        env:
          # The NO_BLOCK/soft-fail pattern: the audit_permit_fail input
          # (or, when unset, the NO_BLOCK_AUDIT_FAIL repository
          # variable) disables failure propagation.
          # yamllint disable-line rule:line-length
          NO_BLOCK: ${{ inputs.audit_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
        run: |
          # TEMPLATE: placeholder audit step; replace with real audit.
          status=0
          echo "Placeholder dependency audit executed"
          if [ "${status}" != "0" ]; then
            if [ "${NO_BLOCK}" = "true" ]; then
              echo "::warning::Audit failed, but failures are" \
                "permitted so the job will not fail."
              exit 0
            fi
            exit "${status}"
          fi

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'build'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.sbom_enabled }}
    timeout-minutes: 10
    outputs:
      # The grype job downloads by this ID, never by name: a caller
      # running this workflow twice in one run without a distinct
      # artifact_suffix uploads under one name, and a name lookup can
      # hand that job the other call's SBOM. The ID makes it fail
      # instead (see 'Explain SBOM download failure').
      sbom_artifact_id: ${{ steps.sbom-upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@7c4a868e1f8e82a27948748eeda306d8e8c117db  # v1.3.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # TEMPLATE: Replace this placeholder with your language SBOM
      # action. It MUST emit sbom-cyclonedx.json at the workspace root
      # (the Grype job contract), e.g.:
      #   - name: 'Generate SBOM'
      #     uses: lfreleng-actions/<lang>-sbom-action@<SHA>  # vX.Y.Z
      #     with:
      #       path_prefix: ${{ inputs.path_prefix }}
      # The placeholder writes a minimal VALID empty CycloneDX document
      # so the downstream Grype scan stays fully functional.
      - name: 'Generate SBOM (placeholder)'
        shell: bash
        run: |
          # TEMPLATE: placeholder SBOM step; replace with a real SBOM
          # generator emitting sbom-cyclonedx.json.
          cat > sbom-cyclonedx.json <<'EOF'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "components": []
          }
          EOF
          echo "Wrote placeholder CycloneDX SBOM (0 components)"

      - name: 'Upload SBOM artifacts'
        id: sbom-upload
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files${{ env.ARTIFACT_SUFFIX }}
          # Glob matches whichever SBOM formats the generator produced
          path: sbom-cyclonedx.*
          retention-days: 45
          # Fail fast: the downstream Grype job requires this artifact,
          # so a missing/misnamed SBOM must surface here, not later
          if-no-files-found: error

      - name: 'SBOM summary'
        shell: bash
        run: |
          # SBOM summary
          {
            echo "## SBOM Summary"
            echo "Placeholder CycloneDX SBOM (0 components)"
          } >> "$GITHUB_STEP_SUMMARY"

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    # yamllint disable-line rule:line-length
    if: ${{ !cancelled() && needs.sbom.result == 'success' && inputs.grype_enabled }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Without an ID (an upload that produced none) download-artifact
      # would fall back to fetching every artefact in the run, so stop
      # here with a clear cause instead.
      - name: 'Check SBOM artefact ID'
        shell: bash
        env:
          SBOM_ARTIFACT_ID: ${{ needs.sbom.outputs.sbom_artifact_id }}
        run: |
          # Check SBOM artefact ID
          if [[ ! "${SBOM_ARTIFACT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::The sbom job exported no SBOM artefact ID;" \
              "check its 'Upload SBOM artifacts' step"
            exit 1
          fi

      # Bound to the sbom job's own upload by ID rather than by name,
      # so a same-named artefact from another call of this workflow in
      # the same run can never be the one scanned here. download-artifact
      # matches IDs against the newest artefact of each name, so when a
      # later call has uploaded an SBOM of the same name this download
      # fails rather than scan the wrong one; a distinct artifact_suffix
      # per call avoids that.
      - name: 'Download SBOM artefact'
        id: sbom-download
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.sbom.outputs.sbom_artifact_id }}

      - name: 'Explain SBOM download failure'
        if: failure() && steps.sbom-download.outcome == 'failure'
        shell: bash
        env:
          SBOM_ARTIFACT_ID: ${{ needs.sbom.outputs.sbom_artifact_id }}
        run: |
          # Explain SBOM download failure
          echo "::error::Could not download SBOM artefact" \
            "${SBOM_ARTIFACT_ID} uploaded by the sbom job. Another call" \
            "of this workflow in the same run may have uploaded an SBOM" \
            "under the same name (give each call a distinct" \
            "artifact_suffix), or the artefact expired or was deleted"

      # The grype_permit_fail input (or, when unset, the NO_BLOCK_AUDIT_FAIL
      # repository variable) disables failure propagation so pull requests
      # can proceed when blocked by newly discovered CVEs in transitive
      # dependencies.
      - name: 'Grype audit SBOM'
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@5c81b23afb2ea771b2d247807a12d90783328675  # v0.5.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: 'grype-scan-results${{ env.ARTIFACT_SUFFIX }}'
