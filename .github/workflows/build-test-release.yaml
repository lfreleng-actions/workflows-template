        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@5c81b23afb2ea771b2d247807a12d90783328675  # v0.5.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: ${{ inputs.grype_fail_on }}
          # yamllint disable-line rule:line-length
          permit-fail: ${{ inputs.grype_permit_fail || vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
          # A release always gates, whatever the change touched
          gate-when: 'always'
          dependency-policy: ${{ inputs.grype_dependency_policy }}
          transitive-fail-on: ${{ inputs.grype_transitive_fail_on }}
          only-fixed: ${{ inputs.grype_only_fixed }}
          bypass-repository: ${{ inputs.grype_bypass_repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: 'grype-scan-results${{ env.ARTIFACT_SUFFIX }}'

