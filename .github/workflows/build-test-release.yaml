---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable build/test/release pipeline SKELETON (Model A: tag-driven).
#
# Reproduces the canonical Linux Foundation release pipeline shape. The
# repository-metadata job runs in parallel as an informational step.
# After build the audit jobs in { } run in parallel; the tests then gate
# on ALL of them (gating inversion: on releases the audits gate the
# expensive test matrix), and publishing runs at the end:
#   tag-validate -> build -> { audit | sbom -> grype } -> tests
#     -> attach-artefacts -> promote-release
#
# Steps marked "# TEMPLATE:" are placeholders. When instantiating this
# template for a language, replace them with the real build/test/audit/
# SBOM actions; the tag validation, release plumbing, harden-runner
# wiring, dual checkout and Grype scan are generic and transfer as-is.
#
# Call this from a thin caller workflow on a tag push; see
# examples/build-test-release/ for both a plain GitHub-native caller and
# a Gerrit-wrapped caller.
name: '[R] Build/Test/Release (Template)'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'

      # --- Tests ---
      test_permit_fail:
        description: 'Permit test failures without failing the workflow'
        required: false
        type: boolean
        default: false

      # --- Audit ---
      audit_enabled:
        description: 'Run the dependency audit job (set false to skip)'
        required: false
        type: boolean
        default: true
      audit_permit_fail:
        description: 'Permit dependency audit failures (the NO_BLOCK pattern)'
        required: false
        type: boolean
        default: false

      # --- SBOM ---
      sbom_enabled:
        description: >-
          Generate an SBOM (set false to skip). The Grype job scans the
          SBOM, so skipping generation leaves it nothing to scan and it
          is skipped too. To keep the SBOM but drop the scan, use
          grype_enabled instead.
        required: false
        type: boolean
        default: true

      # --- Grype scan ---
      grype_enabled:
        description: >-
          Run the Grype vulnerability scan over the generated SBOM (set
          false to skip). Decoupling is one-way: disabling the scan
          keeps the SBOM, but disabling the SBOM also stops the scan,
          which has nothing to read.
        required: false
        type: boolean
        default: true
      grype_fail_on:
        description: >-
          Minimum severity that fails the Grype scan: negligible, low,
          medium, high, critical, or none to report without gating
        required: false
        type: string
        default: 'medium'
      grype_permit_fail:
        description: >-
          Permit Grype findings without failing the job. When false, falls
          back to the NO_BLOCK_AUDIT_FAIL repository variable at runtime.
        required: false
        type: boolean
        default: false
      grype_bypass_repository:
        description: >-
          Repository (owner/name) holding the approved 'BYPASS:' issues
          grype-scan-action honours. Empty reads them from the calling
          repository; set it to share one bypass list.
        required: false
        type: string
        default: ''
      grype_dependency_policy:
        description: >-
          Which findings gate: 'all', or 'declared' for direct
          dependencies only, with transitive ones held to
          grype_transitive_fail_on. Where the SBOM carries no dependency
          graph, 'declared' treats every finding as declared.
        required: false
        type: string
        default: 'declared'
      grype_transitive_fail_on:
        description: >-
          Severity threshold for transitive findings under the
          'declared' policy: none, negligible, low, medium, high or
          critical.
        required: false
        type: string
        default: 'critical'
      grype_only_fixed:
        description: >-
          Gate only on findings with a published fix version. A finding
          nobody can act on is reported, not blocking.
        required: false
        type: boolean
        default: true

      # --- Artefact naming ---
      artifact_suffix:
        description: >-
          Suffix appended, after a hyphen, to the names of the build,
          SBOM and Grype artefacts this workflow uploads. Set a
          distinct value on each call when a caller runs this workflow
          more than once in one run (a matrix). Letters, digits, '.',
          '_' and '-' only; empty keeps the unsuffixed names.
        required: false
        type: string
        default: ''

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0
      harden_runner_supplemental_allowlist:
        description: >-
          Extra harden-runner allow-list merged with
          harden_runner_allowlist, in the same coordinate grammar.
          Empty adds nothing
        required: false
        type: string
        default: ''
      harden_runner_supplemental_unpinned:
        description: >-
          Let harden_runner_supplemental_allowlist omit '@ref' and
          follow its default branch; only a list in the caller's own
          organisation qualifies
        required: false
        type: boolean
        default: false
      harden_runner_extra_endpoints:
        description: >-
          Extra egress endpoints written inline, host[:port] tokens
          separated by spaces or newlines, merged into the allow-list
          for short-lived fixes. Empty adds nothing
        required: false
        type: string
        default: ''

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit target branch'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: >-
          Gerrit server URL. Empty falls back to the GERRIT_URL repository
          variable at runtime.
        required: false
        type: string
        default: ''

      # --- Release-only inputs ---
      attestations:
        description: >-
          Generate build provenance attestations. Placeholder wiring in
          this template: pass it to your build action (or enable the
          commented actions/attest example in the build job) when
          instantiating. Keep it toggleable for air-gapped or
          Gerrit-mirrored consumers that cannot reach Sigstore.
        required: false
        type: boolean
        default: true
      sigstore_sign:
        description: >-
          Sign build artefacts with Sigstore (keyless/OIDC). Placeholder
          wiring in this template: pass it to your build action when
          instantiating. Keep it toggleable for air-gapped or
          Gerrit-mirrored consumers that cannot reach Sigstore.
        required: false
        type: boolean
        default: true

    outputs:
      tag:
        description: 'Validated release tag/version string'
        value: ${{ jobs.tag-validate.outputs.tag }}

permissions: {}

# Turn off GitHub CLI telemetry for every job in this workflow. The
# release steps shell out to 'gh', which otherwise POSTs usage events to
# cafe.github.com. No step here needs that endpoint, and under the org
# harden-runner egress allow-list the attempt surfaces as a blocked
# connection, burying real findings in noise. GH_TELEMETRY takes
# precedence over DO_NOT_TRACK, so this single variable covers both.
#
# ARTIFACT_SUFFIX is the suffix for the names of the artefacts each
# call uploads: '-<artifact_suffix>', or empty when the input is unset
# so the artefact names stay as they were. Every upload and download
# of a per-call artefact appends it; tests/test-artifact-suffix.sh
# checks each site.
env:
  GH_TELEMETRY: 'false'
  # yamllint disable-line rule:line-length
  ARTIFACT_SUFFIX: ${{ inputs.artifact_suffix != '' && format('-{0}', inputs.artifact_suffix) || '' }}

jobs:
  gerrit-validate:
    name: 'Validate Workflow Inputs'
    # Fails fast with a clear message on a malformed artifact_suffix, or
    # when gerrit_refspec is set without the project/branch the Gerrit
    # checkout path also requires. The build-chain root job depends on
    # this, so invalid inputs stop the pipeline early and cleanly. This
    # job always runs (only the Gerrit step is conditional), so gating
    # dependents on it does not trip GitHub's "skipped need skips
    # dependents" behaviour.
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      # The suffix becomes part of artefact names, so only characters
      # that are safe there pass.
      - name: 'Validate artifact_suffix input'
        shell: bash
        env:
          ARTIFACT_SUFFIX_INPUT: ${{ inputs.artifact_suffix }}
        run: |
          # Validate artifact_suffix input
          if [[ ! "${ARTIFACT_SUFFIX_INPUT}" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid artifact_suffix input:" \
              "${ARTIFACT_SUFFIX_INPUT}"
            exit 1
          fi

      - name: 'Validate Grype policy inputs'
        shell: bash
        env:
          GRYPE_FAIL_ON: ${{ inputs.grype_fail_on }}
          GRYPE_BYPASS_REPOSITORY: ${{ inputs.grype_bypass_repository }}
          GRYPE_DEPENDENCY_POLICY: ${{ inputs.grype_dependency_policy }}
          GRYPE_TRANSITIVE_FAIL_ON: ${{ inputs.grype_transitive_fail_on }}
        run: |
          # Reject a typo in the gating policy here, in seconds, rather
          # than in grype-scan-action after the build. The values
          # mirror the action's own enumerations.
          error=0
          case "${GRYPE_FAIL_ON}" in
            negligible|low|medium|high|critical|none) ;;
            *)
              echo "::error::Invalid grype_fail_on input:" \
                "${GRYPE_FAIL_ON}"
              error=1 ;;
          esac
          valid_repository='^([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)?$'
          if [[ ! "${GRYPE_BYPASS_REPOSITORY}" =~ ${valid_repository} ]]; then
            echo "::error::Invalid grype_bypass_repository input:" \
              "${GRYPE_BYPASS_REPOSITORY}"
            error=1
          fi
          case "${GRYPE_DEPENDENCY_POLICY}" in
            all|declared) ;;
            *)
              echo "::error::Invalid grype_dependency_policy input:" \
                "${GRYPE_DEPENDENCY_POLICY}"
              error=1 ;;
          esac
          case "${GRYPE_TRANSITIVE_FAIL_ON}" in
            none|negligible|low|medium|high|critical) ;;
            *)
              echo "::error::Invalid grype_transitive_fail_on input:" \
                "${GRYPE_TRANSITIVE_FAIL_ON}"
              error=1 ;;
          esac
          exit "${error}"

      - name: 'Require Gerrit project, branch and URL'
        if: inputs.gerrit_refspec != ''
        shell: bash
        env:
          GERRIT_PROJECT: ${{ inputs.gerrit_project }}
          GERRIT_BRANCH: ${{ inputs.gerrit_branch }}
          # yamllint disable-line rule:line-length
          GERRIT_URL: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
        run: |
          # gerrit_refspec is set, so the Gerrit checkout path runs and
          # also requires gerrit_project, gerrit_branch and a resolvable
          # Gerrit URL (the gerrit_url input or the GERRIT_URL variable).
          missing=''
          if [ -z "${GERRIT_PROJECT}" ]; then
            missing="${missing} gerrit_project"
          fi
          if [ -z "${GERRIT_BRANCH}" ]; then
            missing="${missing} gerrit_branch"
          fi
          if [ -z "${GERRIT_URL}" ]; then
            missing="${missing} gerrit_url/GERRIT_URL"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::gerrit_refspec is set but missing:${missing}"
            exit 1
          fi
          echo "Gerrit inputs validated ✅"

  repository-metadata:
    name: 'Repository Metadata'
    needs: gerrit-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 'Gather repository metadata'
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@18e5b7c5b16423b0e734891d103513826b324858  # v0.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: ${{ inputs.gerrit_refspec != '' }}
          artifact_upload: 'true'
          artifact_formats: 'json'

  tag-validate:
    name: 'Validate Tag Push'
    needs: gerrit-validate
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Needed to draft a release
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag-validate.outputs.tag_name }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Verify pushed tag'
        id: 'tag-validate'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@a44a0eae476cd22c6695121448c85d45b04d6c03  # v1.1.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          require_type: 'semver'
          reject_development: 'true'
          require_github: 'true'
          # yamllint disable-line rule:line-length
          require_signed: 'ssh,gpg-unverifiable'  # Cannot verify GPG without key

      - name: 'Ensure draft release exists'
        id: 'ensure-release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag-validate.outputs.tag_name }}
        run: |
          # Ensure draft release exists
          # Check if release exists and get its draft status
          if RELEASE_INFO=$(gh release view "$TAG" \
            --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release for tag $TAG already exists"
            else
              echo "::error::A published release already exists for $TAG;" \
                "delete or recreate it as a draft, then re-run."
              exit 1
            fi
          else
            echo "Creating draft release for tag $TAG"
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Automated release for $TAG"
          fi

  build:
    name: 'Build'
    needs: 'tag-validate'
    runs-on: 'ubuntu-latest'
    outputs:
      artefact_name: ${{ steps.build.outputs.artefact_name }}
      artefact_path: ${{ steps.build.outputs.artefact_path }}
    permissions:
      contents: read
      id-token: write       # Needed for attestations
      attestations: write   # Needed for attestations
    timeout-minutes: 12
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@36a02f4a61b27e7a0a91e1df2134abe9545cf54e  # v0.16.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
          # yamllint disable-line rule:line-length
          supplemental_config: ${{ inputs.harden_runner_supplemental_allowlist }}
          # A caller naming a list depends on it, so its absence fails
          # here rather than at the first blocked connection.
          # yamllint disable-line rule:line-length
          supplemental_required: ${{ inputs.harden_runner_supplemental_allowlist != '' && 'true' || 'false' }}
          # yamllint disable-line rule:line-length
          supplemental_unpinned: ${{ inputs.harden_runner_supplemental_unpinned && 'true' || 'false' }}
          extra_endpoints: ${{ inputs.harden_runner_extra_endpoints }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@8721c15dacdd703064df5ade1416f7e5590b65f3  # v1.4.1
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # TEMPLATE: Replace this placeholder with your language build
      # action, passing the sigstore_sign/attestations inputs through
      # where the action supports them, e.g.:
      #   - name: 'Build project'
      #     id: build
      #     uses: lfreleng-actions/<lang>-build-action@<SHA>  # vX.Y.Z
      #     with:
      #       path_prefix: ${{ inputs.path_prefix }}
      #       sigstore_sign: ${{ inputs.sigstore_sign }}
      #       attestations: ${{ inputs.attestations }}
      - name: 'Build project (placeholder)'
        id: build
        shell: bash
        env:
          PATH_PREFIX: ${{ inputs.path_prefix }}
        run: |
          # TEMPLATE: placeholder build step; produces a trivial text
          # artefact so the artifact/release plumbing can be exercised.
          cd "${PATH_PREFIX}"
          mkdir -p dist
          {
            echo "workflows-template placeholder build artefact"
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "run_id: ${GITHUB_RUN_ID}"
          } > dist/template-artefact.txt
          echo "artefact_name=template-build" >> "$GITHUB_OUTPUT"
          echo "artefact_path=${PATH_PREFIX}/dist" >> "$GITHUB_OUTPUT"

      # TEMPLATE: When your build action does NOT handle attestations
      # itself, uncomment this step to generate SLSA build provenance
      # for real artefacts (verifiable with `gh attestation verify`).
      # It ships commented out because attesting the trivial placeholder
      # artefact provides no value.
      #
      # Use actions/attest, not actions/attest-build-provenance: as of
      # v4 the latter is a thin wrapper that forwards its inputs to the
      # former, and GitHub directs new implementations at actions/attest
      # directly. With no predicate supplied it emits SLSA build
      # provenance by default, so the step stays this short.
      #
      # The wrapper is not quite empty: it also sets NODE_OPTIONS to
      # raise node's 16KB header limit, which overflows when pushing
      # attestations to some OCI registries. Nothing below pushes to a
      # registry, but if you add `push-to-registry: true`, carry the
      # setting across yourself:
      #     env:
      #       NODE_OPTIONS: '--max-http-header-size=32768'
      #
      #   - name: 'Attest build provenance'
      #     if: inputs.attestations
      # yamllint disable-line rule:line-length
      #     uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      #     with:
      #       subject-path: 'dist/*'

      - name: 'Upload build artefact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: ${{ steps.build.outputs.artefact_name }}${{ env.ARTIFACT_SUFFIX }}
          path: ${{ steps.build.outputs.artefact_path }}
          if-no-files-found: error

  audit:
    name: 'Audit'
